name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Clone Pikafish
        run: |
          git clone --depth 1 https://github.com/official-pikafish/Pikafish.git /tmp/Pikafish
          cd /tmp/Pikafish/src
          curl -L -o pikafish.nnue https://github.com/official-pikafish/Pikafish/raw/master/src/pikafish.nnue

      - name: Patch Makefile for clang
        run: |
          cd /tmp/Pikafish/src
          sed -i.bak 's/g++/clang++/g' Makefile

      - name: Build Pikafish static lib
        run: |
          cd /tmp/Pikafish/src
          make -j4 build ARCH=apple-silicon COMP=clang
          ar rcs libpikafish.a *.o
          ls -la libpikafish.a

      - name: Copy libs into repo
        run: |
          mkdir -p libs
          cp /tmp/Pikafish/src/libpikafish.a libs/
          cp /tmp/Pikafish/src/*.h libs/
          cp /tmp/Pikafish/src/pikafish.nnue libs/
          ls -la libs/

      - name: Build Tweak
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
