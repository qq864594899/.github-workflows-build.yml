name: Build Tweak
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
      
      - name: Build
        run: make package THEOS_PACKAGE_SCHEME=rootless
        env:
          THEOS: /home/runner/work/theos
      
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
