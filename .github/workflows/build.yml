name: Build Tweak
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /home/runner/theos
          echo "THEOS=/home/runner/theos" >> $GITHUB_ENV
          echo "/home/runner/theos/bin" >> $GITHUB_PATH
          rm -rf /home/runner/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /home/runner/theos/sdks

      - name: Setup Toolchain
        run: |
          mkdir -p /home/runner/theos/toolchain/linux/iphone
          cd /home/runner/theos/toolchain/linux/iphone
          wget -q https://github.com/L1ghtmann/ios-toolchain/releases/download/12.5/ios-toolchain.tar.xz
          tar -xf ios-toolchain.tar.xz
          rm ios-toolchain.tar.xz
          echo "=== 检查 clang 位置: ==="
          find . -name "clang" -type f

      - name: Build
        run: make package THEOS_PACKAGE_SCHEME=rootless
        env:
          THEOS: /home/runner/theos

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
